# Сборка и выкладка на GitHub Pages: после каждого изменения (в том числе из админки)
# и раз в шесть часов, чтобы блок «Разборы в канале» подтягивал свежие посты.
name: Сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'  # посты канала на сайте — не позже чем через час (просьба Ани 05.11)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Свой домен: в настройках репозитория (Settings → Variables) задать SITE_URL=https://домен.ru и SITE_BASE=/
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
